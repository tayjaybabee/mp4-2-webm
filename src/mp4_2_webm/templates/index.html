<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Convert MP4 → WebM</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem auto;
            max-width: 700px;
        }
        h1 {
            margin-bottom: 1rem;
        }
        .upload-box {
            border: 2px dashed #777;
            padding: 2rem;
            text-align: center;
            border-radius: 8px;
        }
        input[type="file"] {
            margin-top: 1rem;
        }
        .submit-btn {
            margin-top: 1.5rem;
            padding: 0.7rem 1.2rem;
            border: none;
            background: #673ab7;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        .submit-btn:hover {
            background: #55329c;
        }
    </style>
</head>
<body>

    <h1>Convert MP4 files to WebM</h1>

    <form action="/" method="POST" enctype="multipart/form-data">
        <div class="upload-box">
            <p>Select one or more MP4 videos:</p>
            <input type="file" name="videos" accept=".mp4" multiple>
            <br>
            <button class="submit-btn" type="submit">Convert</button>
        </div>
    </form>

</body>
</html>
