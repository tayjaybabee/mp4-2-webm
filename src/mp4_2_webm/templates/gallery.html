<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Converted Videos</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem auto;
            max-width: 900px;
        }
        h1 {
            margin-bottom: 1rem;
        }
        .video-block {
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #ccc;
        }
        video {
            width: 100%;
            max-width: 800px;
            display: block;
            margin-bottom: 1rem;
            border-radius: 6px;
            background: #000;
        }
        a.download-btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: #2196f3;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            margin-right: 0.5rem;
        }
        a.download-btn:hover {
            background: #1976d2;
        }
        a.back {
            display: inline-block;
            margin-top: 2rem;
            text-decoration: none;
            color: #673ab7;
        }
    </style>
</head>
<body>

    <h1>Converted Videos</h1>

    {% for vid in vids %}
        <div class="video-block">

            <video controls>
                <source src="{{ url_for('video_file', filename=vid) }}" type="video/webm">
                Your browser does not support WebM playback.
            </video>

            <a class="download-btn" href="{{ url_for('download_file', filename=vid) }}">
                Download {{ vid }}
            </a>
        </div>
    {% endfor %}

    <a class="back" href="{{ url_for('index') }}">&larr; Convert more videos</a>

</body>
</html>
